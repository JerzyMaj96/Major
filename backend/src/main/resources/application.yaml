spring:
  application:
    name: backend
  profiles:
    active: dev
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
logging:
  level:
    root: INFO
    com.jerzymaj.file_researcher_backend: DEBUG
app:
  cors:
    allowed-origins: "${ALLOWED_ORIGIN:http://localhost:5173}"
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 604800000
  github:
    webhook-secret: ${GITHUB_WEBHOOK_SECRET}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5433/major_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true