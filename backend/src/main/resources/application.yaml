spring:
  application:
    name: backend
  profiles:
    active: dev
logging:
  level:
    root: INFO
    com.jerzymaj.file_researcher_backend: DEBUG
app:
  cors:
    allowed-origins: "${ALLOWED_ORIGIN:http://localhost:5173}"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_guest_service_system
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true